spring:
  datasource:
    url: jdbc:h2:mem:voicelink_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

voicelink:
  password-reset:
    # Offline tests use the capturing notifier even when this is enabled explicitly.
    enabled: false
  standard:
    # Ordinary tests stay offline even when the developer shell has live keys.
    free-tier-confirmed: false
  premium:
    enabled: false
    gemini-key: ""
