spring:
  application:
    name: VoiceLink
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
      file-size-threshold: 2MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

voicelink:
  translation:
    timeout: ${VOICELINK_TRANSLATION_TIMEOUT:15s}
  speech:
    max-turns-per-user-per-minute: ${VOICELINK_SPEECH_MAX_TURNS_PER_USER_PER_MINUTE:12}
    max-turns-per-instance-per-minute: ${VOICELINK_SPEECH_MAX_TURNS_PER_INSTANCE_PER_MINUTE:60}
  password-reset:
    enabled: ${VOICELINK_PASSWORD_RESET_ENABLED:false}
    public-base-url: ${VOICELINK_PUBLIC_BASE_URL:}
    mail-api-key: ${VOICELINK_RESET_MAIL_API_KEY:}
    mail-from-address: ${VOICELINK_RESET_MAIL_FROM_ADDRESS:}
  standard:
    free-tier-confirmed: ${VOICELINK_STANDARD_FREE_TIER_CONFIRMED:false}
    groq-key: ${VOICELINK_GROQ_API_KEY:}
    gemini-key: ${VOICELINK_GEMINI_API_KEY:}
  premium:
    enabled: ${VOICELINK_PREMIUM_ENABLED:false}
    gemini-key: ${VOICELINK_PREMIUM_GEMINI_API_KEY:}
    cost-saver:
      preview-minimum-interval-on-ms: ${VOICELINK_PREMIUM_COST_SAVER_ON_PREVIEW_INTERVAL_MS:1500}
      preview-minimum-interval-off-ms: ${VOICELINK_PREMIUM_COST_SAVER_OFF_PREVIEW_INTERVAL_MS:800}
    limits:
      translation-per-user-per-minute: ${VOICELINK_PREMIUM_TRANSLATIONS_PER_USER_PER_MINUTE:8}
      translation-per-room-per-minute: ${VOICELINK_PREMIUM_TRANSLATIONS_PER_ROOM_PER_MINUTE:16}
      translation-per-instance-per-minute: ${VOICELINK_PREMIUM_TRANSLATIONS_PER_INSTANCE_PER_MINUTE:40}
      tts-per-user-per-minute: ${VOICELINK_PREMIUM_TTS_PER_USER_PER_MINUTE:6}
      tts-per-room-per-minute: ${VOICELINK_PREMIUM_TTS_PER_ROOM_PER_MINUTE:12}
      tts-per-instance-per-minute: ${VOICELINK_PREMIUM_TTS_PER_INSTANCE_PER_MINUTE:24}
      max-concurrent-operations: ${VOICELINK_PREMIUM_MAX_CONCURRENT_OPERATIONS:2}
