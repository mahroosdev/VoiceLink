spring:
  application:
    name: VoiceLink
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
      file-size-threshold: 2MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

voicelink:
  standard:
    free-tier-confirmed: ${VOICELINK_STANDARD_FREE_TIER_CONFIRMED:false}
    groq-key: ${VOICELINK_GROQ_API_KEY:}
    gemini-key: ${VOICELINK_GEMINI_API_KEY:}
