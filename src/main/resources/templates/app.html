<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your space | VoiceLink</title>
  <link rel="stylesheet" th:href="@{/css/voicelink.css}">
</head>
<body class="authenticated-shell">
  <a class="skip-link" href="#main">Skip to content</a>
  <div th:replace="~{fragments/app-shell :: chrome('conversations', 'Conversations', ${email})}"></div>
  <main id="main" class="workspace workspace--dashboard">
    <header class="workspace-heading">
      <span class="eyebrow">Workspace</span>
      <h1>Conversations</h1>
      <p>Create a room or join someone with an invite code.</p>
    </header>
    <section class="conversation-start" aria-label="Start a conversation">
      <div class="action-card action-card--create">
        <span class="eyebrow">Start here</span>
        <h2>Create conversation</h2>
        <p>Choose a direction and share a private invite code.</p>
        <a class="button button--primary" th:href="@{/rooms#create}">Create conversation</a>
      </div>
      <div class="action-card action-card--join">
        <h2>Join conversation</h2>
        <p>Enter a code shared with you.</p>
        <a class="button button--secondary" th:href="@{/rooms#join}">Join conversation</a>
      </div>
    </section>
  </main>
</body>
</html>
