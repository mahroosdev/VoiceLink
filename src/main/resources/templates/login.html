<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | VoiceLink</title>
  <link rel="stylesheet" th:href="@{/css/voicelink.css}">
  <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body class="public-shell">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" th:href="@{/}" aria-label="VoiceLink home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path d="M14 7H9a6 6 0 0 0-6 6v5a6 6 0 0 0 6 6h2l3 4v-4M22 7h5a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6h-2l-3 4v-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="17" r="3" fill="currentColor"/></svg></span>
        <span>VoiceLink</span>
      </a>
    </div>
  </header>
  <main id="main" class="container auth-wrap">
    <section class="auth-card card" aria-labelledby="sign-in-heading">
      <span class="eyebrow">Welcome back</span>
      <h1 id="sign-in-heading">Sign in</h1>
      <p class="auth-card__intro">Continue your English ↔ Tamil conversations.</p>
      <p class="notice notice--error" th:if="${param.error}" role="alert">Email or password is incorrect.</p>
      <p class="notice notice--success" th:if="${param.logout}" role="status">You have signed out.</p>
      <p class="notice notice--success" th:if="${registrationSuccess}" th:text="${registrationSuccess}" role="status" aria-live="polite"></p>
      <p class="notice notice--success" th:if="${param.reset}" role="status">Password updated. You can now sign in.</p>
      <p class="notice notice--error" th:if="${param.expired}" role="alert">Your session ended. Please sign in again.</p>
      <form th:action="@{/login}" method="post">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="auth-card__switch" th:if="${@passwordResetSettings.enabled()}"><a th:href="@{/forgot-password}">Forgot password?</a></p>
        <div class="form-actions"><button class="button button--primary" type="submit">Sign in</button></div>
      </form>
      <p class="auth-card__switch">New to VoiceLink? <a th:href="@{/register}">Create an account</a></p>
    </section>
  </main>
</body>
</html>
