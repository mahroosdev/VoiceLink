<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | VoiceLink</title>
  <link rel="stylesheet" th:href="@{/css/voicelink.css}">
  <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body class="public-shell">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="container site-header__inner">
    <a class="brand" th:href="@{/}" aria-label="VoiceLink home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path d="M14 7H9a6 6 0 0 0-6 6v5a6 6 0 0 0 6 6h2l3 4v-4M22 7h5a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6h-2l-3 4v-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="17" r="3" fill="currentColor"/></svg></span>
      <span>VoiceLink</span>
    </a>
  </div></header>
  <main id="main" class="container auth-wrap">
    <section class="auth-card card" aria-labelledby="forgot-heading">
      <span class="eyebrow">Account recovery</span>
      <h1 id="forgot-heading">Forgot your password?</h1>
      <p class="auth-card__intro">Enter your account email to request a reset link.</p>
      <p class="notice notice--success" th:if="${acknowledged}" role="status" aria-live="polite">If an account exists for that email, password reset instructions have been sent.</p>
      <form th:unless="${acknowledged}" th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" th:field="*{email}" type="email" autocomplete="email" required maxlength="254"
                 th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email') ? 'email-error' : ''}">
          <p id="email-error" class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" role="alert"></p>
        </div>
        <div class="form-actions"><button class="button button--primary" type="submit">Send reset instructions</button></div>
      </form>
      <p class="auth-card__switch"><a th:href="@{/login}">Back to sign in</a></p>
    </section>
  </main>
</body>
</html>
